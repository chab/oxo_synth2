# Linux release: one tar.gz holding a VST3 bundle for x86_64 + aarch64 (see
# tools/prepare_linux_installer). Started by hand: Actions > Linux release >
# Run workflow, on the release tag. The archive and its .sha256 are the
# run's artifacts (not zipped), to download and host.
name: Linux release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    # The oldest system supported (glibc 2.36): what it builds runs on newer.
    container: debian:12
    timeout-minutes: 30
    steps:
      - name: Build tools
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends build-essential cmake pkg-config git \
            ca-certificates zip libx11-dev libcairo2-dev libfontconfig-dev zlib1g-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build, check, validate, test
        run: tools/prepare_linux_installer build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.arch }}
          path: dist/linux/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: dist/linux/in
      - name: Merge and archive
        id: package
        run: tools/prepare_linux_installer package dist/linux/in
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/linux/${{ steps.package.outputs.name }}.tar.gz
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/linux/${{ steps.package.outputs.name }}.tar.gz.sha256
          archive: false
          if-no-files-found: error
